name: Deploy

# Applies new migrations in supabase/migrations/ to a Supabase project.
#   merge to main      -> the `staging` GitHub Environment's project
#   push a v* tag      -> the `production` GitHub Environment's project
# Tests are not rerun here: branch protection on main requires CI to pass
# before a merge, and a release tag points at a commit already on main.
on:
  push:
    branches: [main]
    tags: ['v*']

# Never two pushes against the same database at once.
concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate database
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag on a feature branch must not reach production.
      - name: Release tag must be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      # No --include-seed: demo data never goes out from here.
      - run: supabase db push
