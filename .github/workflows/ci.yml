name: CI

# Runs on every branch and every pull request, so a broken change is caught
# at push time rather than at the sprint review.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # Deliberately fake. `app/core/config.py` builds Settings() at import
      # time and `app/core/db.py` calls create_engine() at import time, so
      # both variables must exist or the app cannot even be imported.
      #
      # Nothing here reaches a real database: create_engine() does not
      # connect eagerly, and tests/conftest.py swaps in an in-memory SQLite
      # session for every test. That is why this job needs no Supabase
      # secret and no service container.
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-not-a-real-secret-just-for-tests
      # tests/integration/ runs against a real PostgreSQL that Testcontainers
      # starts in Docker (present on ubuntu-latest). Locally those tests skip
      # when Docker is off; here that must be a FAILURE, so the layer -- which
      # is what catches concurrency races SQLite cannot show -- can never
      # quietly stop running.
      REQUIRE_INTEGRATION: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked fails if uv.lock is out of step with pyproject.toml, so a
      # dependency added without relocking cannot slip through CI.
      - name: Install dependencies
        run: uv sync --locked

      # Unit tests (in-memory SQLite) and integration tests (real Postgres in
      # a container) in one run; both write to the same report.
      - name: Run tests
        run: uv run pytest -q --junitxml=pytest-results.xml

      # Uploaded even on failure -- the report is the evidence, and it is
      # most useful precisely when something went red.
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: backend/pytest-results.xml

  frontend:
    name: Frontend (lint, build, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc -b` runs here, so this also type-checks the components and the
      # Vitest specs under src/.
      - name: Build
        run: npm run build

      # Component tests: jsdom, API mocked. No browser, no server, no database.
      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end (Playwright)
    # Was switched off while the specs failed. The cause was a stale selector
    # (the request form's equipment field was renamed "Other equipment notes"
    # when the equipment picker landed); with that fixed the whole suite,
    # including the coordinator-story and axe accessibility specs, passes
    # against exactly this setup: postgres:16, backend/db/schema.sql, and the
    # seeded organiser below.
    #
    # Switched off again while everyone is still building their own features
    # in parallel. Remove the `if: false` below to turn it back on.
    if: false
    runs-on: ubuntu-latest

    # A disposable database, started and destroyed by GitHub on this runner.
    # Nothing is self-hosted and the team's Supabase project is never touched
    # -- see the guard rail in frontend/playwright.config.ts.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: connectsphere_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # psql speaks the plain URL; SQLAlchemy needs the +psycopg driver.
      PGURL: postgresql://postgres:postgres@localhost:5432/connectsphere_test
      E2E_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/connectsphere_test
      JWT_SECRET: e2e-not-a-real-secret-just-for-local-and-ci-tests

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Only schema.sql is needed for a fresh database: sql/001_role_enum.sql
      # is documentation ("Reference only -- NOT required") and sql/002 is a
      # one-off repair for the live Supabase instance.
      - name: Create schema
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f backend/db/schema.sql

      # Registration always assigns the attendee role by design, so the
      # organiser the specs log in as has to be seeded directly.
      #
      # Inlined rather than calling a helper script on purpose. This step
      # used to run `scripts/create_admin.py`, which was deleted in an
      # unrelated refactor (15c1db7) -- CI then failed on a missing file,
      # because a workflow silently depended on a developer convenience
      # script that was not part of the product. Nothing outside this file
      # can break this step now.
      #
      # It goes through the app's own hasher rather than raw SQL so the
      # stored hash always matches whatever `verify_password` expects; a
      # hardcoded hash would rot the moment the algorithm changed.
      - name: Seed an organiser
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: |
          uv run python - <<'PY'
          from app.core.db import SessionLocal
          from app.core.roles import Role
          from app.core.security import hash_password
          from app.models.user import User

          db = SessionLocal()
          db.add(
              User(
                  name="E2E Organiser",
                  email="e2e_organiser@cs.local",
                  password_hash=hash_password("e2e-password-123"),
                  role=Role.ORGANISER.value,
              )
          )
          db.commit()
          db.close()
          print("Seeded e2e_organiser@cs.local")
          PY

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts uvicorn and vite itself and waits for
      # both to answer before the first test runs.
      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
