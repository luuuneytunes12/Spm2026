[project]
name = "backend"
version = "0.1.0"
description = "Spm2026 API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "bcrypt==4.0.1",
    "email-validator>=2.3.0",
    "fastapi==0.115.6",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]==3.2.4",
    "pydantic-settings==2.7.1",
    "pyjwt>=2.13.0",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.37",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
